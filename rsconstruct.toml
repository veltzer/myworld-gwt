# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.ruff]
src_dirs = ["scripts"]

[processor.pylint]
src_dirs = ["scripts"]

[processor.mypy]
src_dirs = ["scripts"]

[processor.shellcheck]
src_dirs = ["scripts"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_files = [".rumdl.toml", "rsconstruct.toml"]

# ─── repo-specific configuration ────────────────────────────────────────────

# The application is a maven war: pom.xml is its dependency manifest (there
# is no other place for the GWT/GXT dependency closure) and maven does the
# GWT compile and the packaging. rsconstruct owns the build and calls maven
# for it, the same way the cargo processor drives cargo from Cargo.toml.
[processor.explicit.war]
command = "scripts/mvn_package.py"
inputs = ["pom.xml"]
input_globs = ["src/**/*", "war/**/*"]
output_files = ["target/myworld-gwt-1.0.war"]

# openjdk-8-jdk-headless is the JVM pom.xml forks the GWT 2.6 compiler on;
# maven itself runs on the default JDK.
[dependencies]
system = ["maven", "openjdk-8-jdk-headless"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["src", "war/WEB-INF"]
src_files = ["pom.xml"]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checkstyle]
src_dirs = ["src/org/meta/gwtworld"]
args = ["-c", "checkstyle.xml"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.htmlhint]
src_dirs = ["war"]

# ─── css ─────────────────────────────────────────────────────────────────────

[processor.stylelint]
src_dirs = ["war"]
