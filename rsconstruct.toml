# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.checker.ruff]
src_dirs = ["scripts"]


[processor.checker.pyrefly]
src_dirs = ["scripts"]

[processor.checker.ishellcheck]
src_dirs = ["scripts"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".ruff.toml", ".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── repo-specific configuration ────────────────────────────────────────────

# The application is a maven war: pom.xml is its dependency manifest (there
# is no other place for the GWT/GXT dependency closure) and maven does the
# GWT compile and the packaging. rsconstruct owns the build and calls maven
# for it, the same way the cargo processor drives cargo from Cargo.toml.
[processor.explicit.generic.war]
command = "scripts/mvn_package.py"
inputs = ["pom.xml"]
input_globs = ["src/**/*", "war/**/*"]
output_files = ["target/myworld-gwt-1.0.war"]
# maven keeps its build state in target/ (classes, the exploded war, gwt's
# staging and unit cache) and rewrites it on every package
sandbox_writable = ["target"]
# maven downloads its plugins and the dependency closure into ~/.m2
sandbox_network = true

# openjdk-8-jdk-headless is the JVM pom.xml forks the GWT 2.6 compiler on;
# maven itself runs on the default JDK.
[dependencies]
system = ["maven", "openjdk-8-jdk-headless"]

# lint the Lua configuration with luacheck (policy: .luacheckrc)
[processor.checker.iluacheck]
src_dirs = ["config"]

# lint the YAML files with yamllint (policy: .yamllint.yaml)
[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = [".yamllint.yaml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
# warnings fail too, not only fatal errors
strict = true
src_dirs = ["src", "war/WEB-INF"]
src_files = ["checkstyle.xml", "pom.xml"]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checker.icheckstyle]
src_dirs = ["src/org/meta/gwtworld"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.checker.itidy]
src_dirs = ["war"]

# ─── css ─────────────────────────────────────────────────────────────────────

# Only .css is passed: .biome.jsonc turns biome's JavaScript and JSON linters
# off, oxlint covers JavaScript and ijsonlint covers JSON.
[processor.checker.biome]
src_dirs = ["war"]
src_extensions = [".css"]

# every lint suppression names a rule and says why (see the fleet's CLAUDE.md)
[processor.checker.suppressions]
src_dirs = [".github", "config", "scripts", "src/org/meta/gwtworld", "war"]
src_files = [".yamllint.yaml", "README.md"]
